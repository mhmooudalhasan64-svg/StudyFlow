name: Build VAYORA Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "public/**"
      - "assets/**"
      - "api/**"
      - "index.html"
      - "package.json"
      - "vite.config.ts"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Install Capacitor Android tooling and icon generator
        run: npm install --no-save --package-lock=false @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets

      - name: Build web app for Android
        env:
          VITE_API_BASE_URL: https://study-flow-mhm23.vercel.app
        run: npm run build

      - name: Create Android project and sync web assets
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate VAYORA Android launcher icons
        run: npx capacitor-assets generate --android --assetPath assets --iconBackgroundColor '#101A3A'

      - name: Set and verify VAYORA Android version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")]
          gradle_file = next((path for path in candidates if path.is_file()), None)
          if gradle_file is None:
              raise SystemExit("Android app Gradle file was not generated.")

          content = gradle_file.read_text()
          content, code_count = re.subn(r'(?m)(versionCode\s*(?:=\s*)?)\d+', r'\g<1>4', content)
          content, name_count = re.subn(r"""(?m)(versionName\s*(?:=\s*)?)["'][^"']+["']""", r'\g<1>"1.0.2"', content)
          if code_count != 1 or name_count != 1:
              raise SystemExit(f"Could not safely set Android version (versionCode matches={code_count}, versionName matches={name_count}).")
          gradle_file.write_text(content)
          verified = gradle_file.read_text()
          if not re.search(r'versionCode\s*(?:=\s*)?4\b', verified):
              raise SystemExit("Android versionCode verification failed.")
          if not re.search(r'versionName\s*(?:=\s*)?"1\.0\.2"', verified):
              raise SystemExit("Android versionName verification failed.")
          print(f"Verified {gradle_file}: versionCode=4, versionName=1.0.2")
          PY
          grep -E 'versionCode|versionName' android/app/build.gradle android/app/build.gradle.kts 2>/dev/null || true

      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VAYORA-1.0.2-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
