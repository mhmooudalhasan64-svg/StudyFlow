name: Build MASAR Standalone Android APK

on:
  workflow_dispatch:
  push:
    branches: ["golden-vayora-1"]
    paths:
      - "src/**"
      - "public/**"
      - "api/**"
      - "index.html"
      - "package.json"
      - "vite.config.ts"
      - "capacitor.config.json"
      - "android/**"
      - "native-audio-capture/**"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: masar-standalone-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Fetch and verify bundled Whisper model
        shell: bash
        run: |
          set -euo pipefail
          MODEL_DIR="native-audio-capture/android/src/main/assets/models"
          MODEL_PATH="$MODEL_DIR/ggml-base-q5_1.bin"
          mkdir -p "$MODEL_DIR"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/f281eb45af861ab5e5297d23694b7d46e090c02c/ggml-base-q5_1.bin" \
            --output "$MODEL_PATH"
          echo "422f1ae452ade6f30a004d7e5c6a43195e4433bc370bf23fac9cc591f01a8898  $MODEL_PATH" | sha256sum --check -

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1"

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Install Capacitor Android tooling
        run: npm install --no-save --package-lock=false @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Build web app for Android
        env:
          VITE_API_BASE_URL: https://studyflow-preview-preview.up.railway.app
        run: npm run build

      - name: Sync Android project
        run: npx cap sync android

      - name: Verify native plugin is included in Android project
        run: grep -q "vayora-native-audio-capture" android/app/capacitor.build.gradle

      - name: Install and verify new MASAR release signing key
        env:
          MASAR_ANDROID_KEYSTORE_BASE64: ${{ secrets.MASAR_ANDROID_KEYSTORE_BASE64 }}
          MASAR_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MASAR_ANDROID_KEYSTORE_PASSWORD }}
          MASAR_ANDROID_KEY_ALIAS: ${{ secrets.MASAR_ANDROID_KEY_ALIAS }}
          MASAR_ANDROID_KEY_PASSWORD: ${{ secrets.MASAR_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in MASAR_ANDROID_KEYSTORE_BASE64 MASAR_ANDROID_KEYSTORE_PASSWORD MASAR_ANDROID_KEY_ALIAS MASAR_ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required new MASAR signing secret $name is missing. No APK was built."
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/masar-release.jks"
          printf '%s' "$MASAR_ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$MASAR_ANDROID_KEYSTORE_PASSWORD" -alias "$MASAR_ANDROID_KEY_ALIAS" > "$RUNNER_TEMP/masar-keystore-check.txt"
          ACTUAL_CERT_SHA="$(sed -n 's/^[[:space:]]*SHA256: //p' "$RUNNER_TEMP/masar-keystore-check.txt" | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [ -z "$ACTUAL_CERT_SHA" ]; then
            echo "::error::Could not read the signing certificate fingerprint from the MASAR keystore."
            exit 1
          fi
          echo "ANDROID_CERT_SHA256=$ACTUAL_CERT_SHA" >> "$GITHUB_ENV"
          echo "Signing certificate SHA-256: $ACTUAL_CERT_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$MASAR_ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$MASAR_ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$MASAR_ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify standalone APK identity, version and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          BADGING="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.aurevon.masar' versionCode='1'"
          CERTS="$(apksigner verify --print-certs "$APK")"
          echo "$CERTS"
          ACTUAL_CERT_SHA="$(printf '%s\n' "$CERTS" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [ -z "$ANDROID_CERT_SHA256" ] || [ "$ACTUAL_CERT_SHA" != "$ANDROID_CERT_SHA256" ]; then
            echo "::error::APK signature does not match the configured MASAR release keystore."
            exit 1
          fi

      - name: Upload verified standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: MASAR-Android-Standalone-v1
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
