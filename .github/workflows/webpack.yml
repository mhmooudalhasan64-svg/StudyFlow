name: ATHEER MASAR quality checks

on:
  push:
    branches:
      - atheer-masar-brand-preview
      - fix/masar-dalil-reliability
      - fix/dalil-reliability-preview
      - feat/dalil-conversational-intelligence
      - feat/dalil-intelligence-core
      - feat/dalil-live-call-ui
      - feat/dalil-voice-barge-in
      - feat/dalil-local-auto-barge-in
      - feat/masar-university-hub
      - feat/masar-medical-hub
  pull_request:
    branches:
      - main
      - atheer-masar-brand-preview
      - fix/masar-dalil-reliability
      - fix/dalil-reliability-preview
      - feat/dalil-conversational-intelligence
      - feat/dalil-intelligence-core
      - feat/dalil-live-call-ui
      - feat/dalil-voice-barge-in
      - feat/dalil-local-auto-barge-in
      - feat/masar-university-hub

permissions:
  contents: read

concurrency:
  group: atheer-masar-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
